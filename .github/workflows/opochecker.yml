name: Opochecker (diagnostico)

# El vigilante corre ahora en el servidor (Docker, ver README). Este flujo ya NO
# tiene schedule: se lanza solo a mano desde la pestana Actions y ejecuta --verify,
# que es de solo lectura (no envia avisos ni consume comandos de Telegram).
# Sirve para detectar que un boletin ha cambiado su HTML y hay que ajustar el parser.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar configuracion
        run: cp config.json.example config.json

      - name: Comprobar que se extraen anuncios de cada boletin
        run: python opochecker.py --verify
